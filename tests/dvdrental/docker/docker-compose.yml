name: id-translation-tests

services:
  mysql:
    image: docker.io/rsundqvist/sakila-preload:mysql
    ports:
      - "5001:3306"

  postgres:
    image: docker.io/rsundqvist/sakila-preload:postgres
    ports:
      - "5002:5432"

  mssql:
    image: docker.io/rsundqvist/sakila-preload:mssql
    ports:
      - "5003:1433"

  s3:
    image: docker.io/chrislusf/seaweedfs:4.47
    # Small volumes, many slots: on small runner disks the filer's own log otherwise takes every slot, and PUTs fail.
    command: [ "server", "-s3", "-master.volumeSizeLimitMB=16", "-volume.max=100" ]
    environment:
      AWS_ACCESS_KEY_ID: s3admin
      AWS_SECRET_ACCESS_KEY: s3admin
    ports:
      - "9000:8333"
      - "8888:8888"
    healthcheck:
      test: [ "CMD", "nc", "-z", "127.0.0.1", "8333" ]
      interval: 2s
      timeout: 2s
      retries: 15

  s3-admin:
    image: docker.io/chrislusf/seaweedfs:4.47
    command: [ "admin", "-port=23646", "-masters=s3:9333", "-ip=0.0.0.0", "-allowInsecureBind" ]
    ports:
      - "23646:23646"
    depends_on:
      s3:
        condition: service_healthy
    profiles: [ "debug" ]
