name: dvdrental

services:
  mysql:
    image: rsundqvist/sakila-preload:mysql
    ports:
      - "5001:3306"

  postgres:
    image: rsundqvist/sakila-preload:postgres
    ports:
      - "5002:5432"

  mssql:
    image: rsundqvist/sakila-preload:mssql
    ports:
      - "5003:1433"

  s3:
    image: chrislusf/seaweedfs:4.47
    command: [ "server", "-s3" ]
    environment:
      AWS_ACCESS_KEY_ID: s3admin
      AWS_SECRET_ACCESS_KEY: s3admin
    ports:
      - "9000:8333"
    healthcheck:
      test: [ "CMD", "nc", "-z", "127.0.0.1", "8333" ]
      interval: 2s
      timeout: 2s
      retries: 15
