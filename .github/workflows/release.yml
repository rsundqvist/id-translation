name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.14 with uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'

      - name: Build package
        run: uv build

      - name: Publish package on PyPI
        uses: pypa/gh-action-pypi-publish@v1.13.0

      - name: Publish package on TestPyPI
        uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: false  # TODO: Might not need this?

  github_release:
    needs: release
    name: Create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # The gh CLI is preinstalled. Replaces the archived actions/create-release and mindsers/changelog-reader-action,
      # Node 20 actions that failed with "Resource not accessible by integration" for v1.4.1.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {f = 1; next} /^## \[/ {f = 0} f' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No CHANGELOG.md entry for $version."
            exit 1
          fi
          gh release create "$TAG" --verify-tag --title "Release $TAG" --notes-file notes.md
