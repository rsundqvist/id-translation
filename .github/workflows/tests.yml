name: tests

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log level"
        required: true
        default: "info"
  push:
    branches:
      - master
      - ci/*
      - release/*
  pull_request:

env:
  POLARS_SKIP_CPU_CHECK: true

jobs:
  linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11 with uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'

      - name: Install the project
        run: uv sync --locked --all-extras

      - name: Linting
        run: uv run inv lint

  tests:
    needs: linting
    name: ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: true
      matrix:
        os: [ 'Ubuntu', 'MacOS', 'Windows' ]
        python-version: [ '3.11', '3.12', '3.13', '3.14', '3.15' ]
        experimental: [ false ]
        # include:
        #  - { os: 'Ubuntu', python-version: '3.16', experimental: true }
        #  - { os: 'MacOS', python-version: '3.15', experimental: true }
        #  - { os: 'Windows', python-version: '3.15', experimental: true }
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }} with uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --locked --all-extras

      - name: Run mypy with nox
        shell: bash
        run: uv run nox --force-color -s mypy-${{ matrix.python-version }}

      - name: Run tests with nox
        shell: bash
        env:
          PYTEST_ADDOPTS: --ignore=tests/dvdrental # The dvdrental job runs these.
        run: uv run nox --force-color -s tests-${{ matrix.python-version }}

      - name: Run audit
        if: matrix.python-version == '3.11' && matrix.os == 'Ubuntu'
        shell: bash
        run: uv run nox --force-color -s audit

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ matrix.python-version }}+${{ matrix.os }}
          path: ".coverage.*"
          if-no-files-found: "error"
          include-hidden-files: true

  dvdrental:
    needs: linting
    name: Docker / ${{ matrix.python-version }}
    runs-on: ubuntu-latest # No Docker for Mac and Windows in CI/CD.
    strategy:
      fail-fast: true
      matrix:
        python-version: [ '3.11', '3.15' ] # Oldest and newest, for the database drivers.
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }} with uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Start Docker databases
        shell: bash
        run: ./run-docker-dvdrental.sh

      - name: Install the project
        run: uv sync --locked --all-extras

      - name: Run Docker tests with nox
        shell: bash
        env:
          COVERAGE_FILE: .coverage.Linux-dvdrental.${{ matrix.python-version }} # Not the tests job's name.
        run: uv run nox --force-color -s tests-${{ matrix.python-version }} -- --path=tests/dvdrental

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-dvdrental-${{ matrix.python-version }}
          path: ".coverage.*"
          if-no-files-found: "error"
          include-hidden-files: true

  free-threading:
    needs: linting
    name: ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: true
      matrix:
        os: [ 'Ubuntu' ] # Ubuntu only, for the foreseeable future.
        python-version: [ '3.14t', '3.15t' ]
        experimental: [ false ]
    steps:
      - uses: actions/checkout@v6

      - name: Set up free-threaded Python ${{ matrix.python-version }} with uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install nox
        run: uv tool install nox

      - name: Run free-threaded race tests with nox
        shell: bash
        # Tool-installed nox, not `uv run`: syncing the project's default groups fails on free-threaded builds.
        run: nox --force-color -s free_threading-${{ matrix.python-version }}

  coverage:
    needs: [ tests, dvdrental ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.14 with uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'

      - name: Install the project
        run: uv sync --locked --all-extras

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Create coverage report
        shell: bash
        run: uv run nox --force-color --session=coverage -- --fmt xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
